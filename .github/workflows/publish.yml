name: Publish packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Check release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a stable vX.Y.Z tag');
          for (const dir of readdirSync('packages')) {
            const pkg = JSON.parse(readFileSync(`packages/${dir}/package.json`, 'utf8'));
            if (!pkg.private && pkg.version !== tag.slice(1)) throw new Error(`${pkg.name} version must match ${tag}`);
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack tested packages and publish with provenance
        run: |
          mkdir -p "$RUNNER_TEMP/email-release"
          pnpm -r --filter './packages/*' pack --pack-destination "$RUNNER_TEMP/email-release"
          for tarball in "$RUNNER_TEMP/email-release"/*.tgz; do
            npm publish "$tarball" --provenance --access public --ignore-scripts --registry https://registry.npmjs.org
          done
